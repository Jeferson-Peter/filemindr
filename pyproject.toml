[project]
name = "filemindr"
version = "1.5.0"
description = "Declarative local file pipelines in Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jeferson Peter" }]

dependencies = [
  "typer",
  "pyyaml",
  "loguru",
  "pydantic-settings",
  "watchfiles>=1.1.1",
  "send2trash>=2.1.0",
]

[project.scripts]
filemindr = "filemindr.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filemindr"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/filemindr",
  "/tests",
  "/docs",
  "/scripts",
  "/release-notes",
  "/README.md",
  "/CASE_STUDY.md",
  "/LICENSE*",
  "/uv.lock",
  "/.python-version",
]
