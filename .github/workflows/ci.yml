name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m filemindr --help
      - run: uv build
      - run: uv run python scripts/check_distributions.py
      - name: Install wheel outside the source environment
        shell: bash
        run: |
          uv venv .package-check
          uv pip install --python .package-check dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then
            .package-check/Scripts/python -I scripts/check_installed.py
          else
            .package-check/bin/python -I scripts/check_installed.py
          fi
      - name: Install source distribution outside the source environment
        shell: bash
        run: |
          uv venv .package-check-sdist
          uv pip install --python .package-check-sdist dist/*.tar.gz
          if [ "$RUNNER_OS" = "Windows" ]; then
            .package-check-sdist/Scripts/python -I scripts/check_installed.py
          else
            .package-check-sdist/bin/python -I scripts/check_installed.py
          fi
