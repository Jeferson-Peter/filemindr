name: Publish Python Package

# Publishing requires an explicit workflow dispatch on development.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/development'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv build
      - run: uv run python scripts/check_distributions.py
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: verified-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v7
        with:
          name: verified-dist
          path: dist
      - name: Publish verified artifacts
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
